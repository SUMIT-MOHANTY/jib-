<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-wrapper">
        <header class="site-header">
            <div class="container">
                <h1 class="site-title">Get In Touch</h1>
                <p class="site-subtitle">We'd love to hear from you. Send us a message!</p>
            </div>
        </header>
        
        <main class="main-content">
            <div class="container">
                <div class="contact-card">
                    <form id="contact-form" class="contact-form" novalidate>
                        <div class="form-group">
                            <label for="name" class="form-label">Full Name</label>
                            <input 
                                type="text" 
                                id="name" 
                                name="name" 
                                class="form-input" 
                                placeholder="John Doe"
                                required
                                autocomplete="name"
                            >
                            <span class="form-error" id="name-error"></span>
                        </div>
                        
                        <div class="form-group">
                            <label for="email" class="form-label">Email Address</label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                class="form-input" 
                                placeholder="john@example.com"
                                required
                                autocomplete="email"
                            >
                            <span class="form-error" id="email-error"></span>
                        </div>
                        
                        <div class="form-group">
                            <label for="subject" class="form-label">Subject</label>
                            <input 
                                type="text" 
                                id="subject" 
                                name="subject" 
                                class="form-input" 
                                placeholder="What is this about?"
                                required
                            >
                            <span class="form-error" id="subject-error"></span>
                        </div>
                        
                        <div class="form-group">
                            <label for="message" class="form-label">Message</label>
                            <textarea 
                                id="message" 
                                name="message" 
                                class="form-input form-textarea" 
                                placeholder="Your message here..."
                                rows="5"
                                required
                            ></textarea>
                            <span class="form-error" id="message-error"></span>
                            <span class="char-count" id="char-count">0 / 2000</span>
                        </div>
                        
                        <button type="submit" class="submit-btn" id="submit-btn">
                            <span class="btn-text">Send Message</span>
                            <span class="btn-spinner"></span>
                        </button>
                    </form>
                    
                    <div class="form-message form-message--success" id="success-message" hidden>
                        <div class="message-icon">✓</div>
                        <h3 class="message-title">Message Sent!</h3>
                        <p class="message-text">Thank you for reaching out. We'll get back to you soon.</p>
                        <button type="button" class="btn-reset" id="reset-btn">Send Another Message</button>
                    </div>
                    
                    <div class="form-message form-message--error" id="error-message" hidden>
                        <div class="message-icon">!</div>
                        <h3 class="message-title">Something Went Wrong</h3>
                        <p class="message-text" id="error-text">Please try again later.</p>
                    </div>
                </div>
            </div>
        </main>
        
        <footer class="site-footer">
            <div class="container">
                <p>&copy; 2024 Contact Form. All rights reserved.</p>
            </div>
        </footer>
    </div>
    
    <script src="/static/js/main.js"></script>
</body>
</html>
