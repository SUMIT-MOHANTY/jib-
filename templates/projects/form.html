{% extends 'base.html' %}
{% block title %}{% if project %}Edit{% else %}New{% endif %} Project{% endblock %}
{% block content %}
<h1>{% if project %}Edit{% else %}New{% endif %} Project</h1>
<div class="card">
    <form method="POST">
        <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" value="{{ project.title if project else '' }}" required>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="4">{{ project.description if project else '' }}</textarea>
        </div>
        <div class="form-group">
            <label>Image URL</label>
            <input type="text" name="image_url" value="{{ project.image_url if project else '' }}">
        </div>
        <div class="form-group">
            <label>Technologies (comma-separated)</label>
            <input type="text" name="technologies" value="{{ project.technologies if project else '' }}">
        </div>
        <div class="form-group">
            <label>Project URL</label>
            <input type="text" name="project_url" value="{{ project.project_url if project else '' }}">
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('projects.list') }}" class="btn">Cancel</a>
    </form>
</div>
{% endblock %}
